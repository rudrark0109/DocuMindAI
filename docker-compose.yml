services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind_ai
    ports:
      - "5433:5432"
    volumes:
      - documind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: documind_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - documind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/documind_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FRONTEND_ORIGIN: http://localhost:5173
      MAX_UPLOAD_SIZE_MB: 25
      PADDLE_OCR_LANGUAGE: en
      PADDLE_OCR_VERSION: PP-OCRv6
      PADDLE_OCR_DEVICE: cpu
      RAG_PROVIDER: ${RAG_PROVIDER:-auto}
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
      RAG_GEMINI_MODEL: ${RAG_GEMINI_MODEL:-gemini-2.5-flash}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.25}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
      RAG_MAX_CITATIONS: ${RAG_MAX_CITATIONS:-8}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-150}
      OCR_LARGE_DOCUMENT_PAGE_THRESHOLD: ${OCR_LARGE_DOCUMENT_PAGE_THRESHOLD:-20}
      OCR_LARGE_DOCUMENT_DPI: ${OCR_LARGE_DOCUMENT_DPI:-96}
      OCR_MAX_RENDER_SIDE: ${OCR_MAX_RENDER_SIDE:-2400}
      OCR_MAX_RENDER_PIXELS: ${OCR_MAX_RENDER_PIXELS:-4000000}
      OCR_TEXT_SCORE_THRESHOLD: ${OCR_TEXT_SCORE_THRESHOLD:-0.5}
      OCR_USE_DOC_ORIENTATION: ${OCR_USE_DOC_ORIENTATION:-false}
      OCR_USE_TEXTLINE_ORIENTATION: ${OCR_USE_TEXTLINE_ORIENTATION:-false}
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - huggingface_cache:/root/.cache/huggingface
      - paddle_cache:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind_worker
    restart: unless-stopped
    command: celery -A backend.app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/documind_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PADDLE_OCR_LANGUAGE: en
      PADDLE_OCR_VERSION: PP-OCRv6
      PADDLE_OCR_DEVICE: cpu
      RAG_PROVIDER: ${RAG_PROVIDER:-auto}
      RAG_GEMINI_API_KEY: ${RAG_GEMINI_API_KEY:-}
      RAG_GEMINI_MODEL: ${RAG_GEMINI_MODEL:-gemini-2.5-flash}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.25}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
      RAG_MAX_CITATIONS: ${RAG_MAX_CITATIONS:-8}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-150}
      OCR_LARGE_DOCUMENT_PAGE_THRESHOLD: ${OCR_LARGE_DOCUMENT_PAGE_THRESHOLD:-20}
      OCR_LARGE_DOCUMENT_DPI: ${OCR_LARGE_DOCUMENT_DPI:-96}
      OCR_MAX_RENDER_SIDE: ${OCR_MAX_RENDER_SIDE:-2400}
      OCR_MAX_RENDER_PIXELS: ${OCR_MAX_RENDER_PIXELS:-4000000}
      OCR_TEXT_SCORE_THRESHOLD: ${OCR_TEXT_SCORE_THRESHOLD:-0.5}
      OCR_USE_DOC_ORIENTATION: ${OCR_USE_DOC_ORIENTATION:-false}
      OCR_USE_TEXTLINE_ORIENTATION: ${OCR_USE_TEXTLINE_ORIENTATION:-false}
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-false}
    volumes:
      - ./storage:/app/storage
      - huggingface_cache:/root/.cache/huggingface
      - paddle_cache:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: documind_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  documind_postgres_data:
  documind_redis_data:
  huggingface_cache:
  paddle_cache:
