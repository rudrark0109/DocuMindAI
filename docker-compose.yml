services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind_ai
    ports:
      - "5433:5432"
    volumes:
      - documind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/documind_ai
      FRONTEND_ORIGIN: http://localhost:5173
      PADDLE_OCR_LANGUAGE: en
      PADDLE_OCR_VERSION: PP-OCRv6
      PADDLE_OCR_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - huggingface_cache:/root/.cache/huggingface
      - paddle_cache:/root/.paddlex
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: documind_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  documind_postgres_data:
  huggingface_cache:
  paddle_cache:
