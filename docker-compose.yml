services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind_ai
    ports:
      - "5433:5432"
    volumes:
      - documind_postgres_data:/var/lib/postgresql/data

volumes:
  documind_postgres_data: